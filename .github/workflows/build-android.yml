name: Build Android App Bundle (Google Play)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Bubblewrap Environment Paths
        run: |
          # Bubblewrap checks for $ANDROID_HOME/tools or $ANDROID_HOME/bin
          if [ -d "$ANDROID_HOME/cmdline-tools/latest" ] && [ ! -e "$ANDROID_HOME/tools" ]; then
            echo "Creating symlink $ANDROID_HOME/tools -> $ANDROID_HOME/cmdline-tools/latest"
            sudo ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          fi

          mkdir -p ~/.bubblewrap
          cat << EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "$JAVA_HOME",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          cat ~/.bubblewrap/config.json

      - name: Setup Signing Keystore
        id: keystore
        run: |
          KEY_PASS="skyoracle_upload_key"
          if [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            KEY_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          fi

          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "Using existing keystore from repository secrets..."
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > ./android.keystore
          else
            echo "Generating new release upload keystore..."
            keytool -genkey -v \
              -keystore ./android.keystore \
              -alias android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$KEY_PASS" \
              -keypass "$KEY_PASS" \
              -dname "CN=SkyOracle, OU=Lapsed Academics, O=Lapsed Academics, L=Jacksonville, ST=Florida, C=US"
          fi

          cp ./android.keystore android/android.keystore

          # Extract SHA-256 fingerprint for Digital Asset Links
          SHA256_FP=$(keytool -list -v -keystore ./android.keystore -alias android -storepass "$KEY_PASS" | grep "SHA256:" | awk '{print $2}')
          echo "SHA256_FINGERPRINT=$SHA256_FP" >> $GITHUB_ENV

          cat << EOF > BUILD_INFO.txt
          ==================================================
          SkyOracle — Google Play Android Bundle Build
          ==================================================
          Package ID: com.lapsedacademics.skyoracle
          Version Name: 1.0.18
          Version Code: 5
          Web App URL: https://aacero.github.io/sky-oracle/
          Signing Key Alias: android
          Upload Keystore SHA-256 Fingerprint:
          $SHA256_FP

          Google Play Console Upload Steps:
          1. Download 'app-release-bundle.aab' from this workflow run.
          2. Open Google Play Console -> SkyOracle -> Testing -> Closed testing (or Internal testing).
          3. Click 'Create new release', upload 'app-release-bundle.aab', and click Save.
          4. Google Play App Signing will generate your final app distribution key.
          ==================================================
          EOF

          echo "### 🚀 Android Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Package ID**: \`com.lapsedacademics.skyoracle\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target PWA**: https://aacero.github.io/sky-oracle/" >> $GITHUB_STEP_SUMMARY
          echo "- **Upload Keystore SHA-256**: \`$SHA256_FP\`" >> $GITHUB_STEP_SUMMARY

      - name: Scaffold & Update Android Project
        run: |
          npx -y @bubblewrap/cli update --skipVersionUpgrade --manifest ./android/twa-manifest.json

      - name: Apply Android 15 Edge-to-Edge Compatibility
        run: |
          node -e '
          const fs = require("fs");

          // 1. Remove deprecated status and navigation bar color parameters from AndroidManifest.xml
          const manifestPath = "app/src/main/AndroidManifest.xml";
          if (fs.existsSync(manifestPath)) {
            let xml = fs.readFileSync(manifestPath, "utf8");
            xml = xml.replace(/<meta-data\b[^>]*\/>/g, (tag) => {
              if (/STATUS_BAR_COLOR|NAVIGATION_BAR_COLOR|NAVIGATION_BAR_DIVIDER_COLOR/.test(tag)) {
                return "";
              }
              return tag;
            });
            fs.writeFileSync(manifestPath, xml);
            console.log("Cleaned deprecated bar color meta-data from AndroidManifest.xml");
          }

          // 2. Enable Android 11+ (API 30+) edge-to-edge immersive window in LauncherActivity.java
          const pkgId = require("./android/twa-manifest.json").packageId;
          const pkgPath = pkgId.replace(/\./g, "/");
          const launcherPath = `app/src/main/java/${pkgPath}/LauncherActivity.java`;
          if (fs.existsSync(launcherPath)) {
            let java = fs.readFileSync(launcherPath, "utf8");
            if (!java.includes("setDecorFitsSystemWindows")) {
              java = java.replace(
                "super.onCreate(savedInstanceState);",
                "super.onCreate(savedInstanceState);\\n        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {\\n            getWindow().setDecorFitsSystemWindows(false);\\n            android.view.WindowInsetsController insetsController = getWindow().getInsetsController();\\n            if (insetsController != null) {\\n                insetsController.hide(android.view.WindowInsets.Type.statusBars() | android.view.WindowInsets.Type.navigationBars());\\n                insetsController.setSystemBarsBehavior(android.view.WindowInsetsController.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);\\n            }\\n        }"
              );
              fs.writeFileSync(launcherPath, java);
              console.log("Patched LauncherActivity.java with edge-to-edge immersive window.");
            }
          }
          '

      - name: Build Android App Bundle (.aab) & APK
        run: |
          KEY_PASS="skyoracle_upload_key"
          if [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            KEY_PASS="${{ secrets.KEYSTORE_PASSWORD }}"
          fi

          export BUBBLEWRAP_KEYSTORE_PASSWORD="$KEY_PASS"
          export BUBBLEWRAP_KEY_PASSWORD="$KEY_PASS"

          npx -y @bubblewrap/cli build --skipPwaValidation --manifest ./android/twa-manifest.json --signingKeyPath ./android.keystore

      - name: Prepare Artifacts
        run: |
          mkdir -p output
          find . -name "*.aab" -exec cp {} output/ \;
          find . -name "*release*.apk" -exec cp {} output/ \;
          cp ./android.keystore output/upload-keystore.keystore || true
          cp BUILD_INFO.txt output/ || true
          ls -lh output/

      - name: Upload Android Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: google-play-release-bundle
          path: output/
          retention-days: 30
