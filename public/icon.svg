<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="skyGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0a0e14" />
    </radialGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <rect width="512" height="512" rx="128" fill="url(#skyGrad)" stroke="#30363d" stroke-width="8" />

  <!-- Stars -->
  <circle cx="120" cy="110" r="3" fill="#ffffff" opacity="0.8" />
  <circle cx="210" cy="90" r="4.5" fill="#58a6ff" opacity="0.9" />
  <circle cx="390" cy="120" r="3" fill="#ffffff" opacity="0.7" />
  <circle cx="430" cy="220" r="2.5" fill="#ffffff" opacity="0.6" />
  <circle cx="95" cy="270" r="3.5" fill="#ffffff" opacity="0.7" />
  <circle cx="320" cy="80" r="2" fill="#ffffff" opacity="0.5" />
  <circle cx="160" cy="210" r="2" fill="#ffffff" opacity="0.4" />

  <!-- Twinkle Star -->
  <path d="M 270 140 Q 270 160 290 160 Q 270 160 270 180 Q 270 160 250 160 Q 270 160 270 140 Z" fill="#38bdf8" opacity="0.9" />

  <!-- Crescent Moon -->
  <path d="M 330 150 A 90 90 0 1 0 410 280 A 105 105 0 1 1 330 150 Z" fill="url(#goldGrad)" filter="drop-shadow(0 0 16px rgba(251, 191, 36, 0.4))" />

  <!-- Telescope Illustration -->
  <g transform="translate(140, 220)">
    <!-- Tripod Legs -->
    <line x1="120" y1="110" x2="60" y2="240" stroke="#8b949e" stroke-width="8" stroke-linecap="round" />
    <line x1="120" y1="110" x2="120" y2="240" stroke="#6e7681" stroke-width="8" stroke-linecap="round" />
    <line x1="120" y1="110" x2="180" y2="240" stroke="#8b949e" stroke-width="8" stroke-linecap="round" />
    <circle cx="120" cy="110" r="10" fill="#c9d1d9" />

    <!-- Optical Tube Assembly (angled up-right) -->
    <g transform="rotate(-35, 120, 110)">
      <!-- Main Tube -->
      <rect x="30" y="94" width="180" height="32" rx="6" fill="url(#glowGrad)" />
      <!-- Dew Shield / Objective End -->
      <rect x="195" y="90" width="30" height="40" rx="4" fill="#58a6ff" />
      <line x1="225" y1="92" x2="225" y2="128" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
      <!-- Eyepiece / Diagonal -->
      <rect x="15" y="100" width="18" height="20" rx="3" fill="#30363d" />
      <rect x="5" y="82" width="16" height="24" rx="3" fill="#8b949e" />
      <!-- Finder scope -->
      <rect x="90" y="80" width="50" height="10" rx="2" fill="#30363d" />
      <line x1="100" y1="94" x2="100" y2="88" stroke="#8b949e" stroke-width="3" />
      <line x1="130" y1="94" x2="130" y2="88" stroke="#8b949e" stroke-width="3" />
    </g>
  </g>
</svg>
